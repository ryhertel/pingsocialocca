name: CI

on:
  pull_request:
    branches: [main]

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run lint

      # `npm run build` is plain `vite build` (esbuild transpile), so nothing in
      # CI has ever checked types. This is the step that does.
      - run: npx tsc -p tsconfig.app.json --noEmit

      - run: npm test
      - run: npm run build

  edge-functions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      # Resolves the real Deno module graph, so a broken relative import in an
      # edge function fails the PR instead of the deploy.
      - name: Typecheck edge functions
        run: deno check supabase/functions/*/index.ts
